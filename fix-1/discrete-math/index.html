<script>/* Z-Math public counter (abacus): one visit per browser session, +1 per minute of active use */
(function(){ var NS="https://abacus.jasoncameron.dev/hit/kzogovic.github.io/";
 function hit(k){ try{ fetch(NS+k).catch(function(){}); }catch(e){} }
 try{ if(!sessionStorage.getItem("zmVisit")){ sessionStorage.setItem("zmVisit","1"); hit("zmath-visits"); } }catch(e){ hit("zmath-visits"); }
 var acc=0,last=Date.now(),act=Date.now();
 ["pointerdown","keydown","scroll","touchstart","mousemove"].forEach(function(e){ addEventListener(e,function(){act=Date.now();},{passive:true}); });
 setInterval(function(){ var n=Date.now(); if(document.visibilityState==="visible"&&n-act<120000) acc+=(n-last)/1000; last=n;
   if(acc>=60){ acc-=60; setTimeout(function(){hit("zmath-minutes");},Math.random()*8000); } },10000);
})();</script>
<script defer src="https://cloud.umami.is/script.js" data-website-id="0c59c8ac-f594-41fb-ac04-392482ab3e25"></script>
<script>/* Z-Math time counter: counts only time the page is open, visible and in use. No names, no cookies. */
(function(){ var BOOK='Z-Discrete Math', STEP=300, acc=0, last=Date.now(), active=Date.now();
 function used(){ active=Date.now(); } ["pointerdown","keydown","scroll","touchstart","mousemove"].forEach(function(e){ addEventListener(e,used,{passive:true}); });
 function send(n){ for(var i=0;i<n;i++){ try{ window.umami&&umami.track("5 minutes of use",{book:BOOK}); }catch(e){} } }
 function tick(){ var now=Date.now(); if(document.visibilityState==="visible"&&now-active<120000) acc+=(now-last)/1000; last=now; if(acc>=STEP){ var n=Math.floor(acc/STEP); acc-=n*STEP; send(n); } }
 setInterval(tick,15000);
 document.addEventListener("visibilitychange",function(){ tick(); if(document.visibilityState==="hidden"&&acc>=STEP/2){ acc=0; send(1); } });
})();</script>
