<script>
/* ---- shared rubric checks ---- */
const ACCEPT=[/accept(ed|ing|s)?\s+(the\s+)?(h\s*[0₀o]|h-?naught|null)/,"“Accepting H₀” is never correct. Say “fail to reject H₀”."];
const PROVE=[/\bprove/,"Statistics does not “prove” a claim. Say “convincing evidence”."];
const HSTAT=[/h\s*[0₀oaₐ]\s*:\s*(p̂|p\s*-?\s*hat|x̄|x\s*-?\s*bar)/,"A sample statistic (p̂ or x̄) appears in a hypothesis. Hypotheses must be about population parameters (p or μ)."];
window.ZTEST={n:1,title:"Full-length practice exam",
units:{"1":"Exploring One-Variable Data and Collecting Data","2":"Probability, Random Variables, and Probability Distributions","3":"Inference for Categorical Data: Proportions","4":"Inference for Quantitative Data: Means","5":"Regression Analysis"},
sets:{
 P:{range:"15–17",stem:`A high school surveyed all 400 of its students about the type of phone they use. The results are shown by class group.
 <table class="tb"><tr><th></th><th>iPhone</th><th>Android</th><th>Other</th><th>Total</th></tr>
 <tr><th>Underclass (grades 9–10)</th><td>120</td><td>60</td><td>20</td><td>200</td></tr>
 <tr><th>Upperclass (grades 11–12)</th><td>100</td><td>80</td><td>20</td><td>200</td></tr>
 <tr><th>Total</th><td>220</td><td>140</td><td>40</td><td>400</td></tr></table>One student is selected at random from the school.`},
 R:{range:"40–42",stem:`A teacher collected data from a random sample of 25 students in her school on the number of hours spent studying for a test (<i>x</i>) and the test score (<i>y</i>, out of 100). The least-squares regression line is
 <p style="text-align:center"><b>predicted score = 45.2 + 3.8(hours)</b></p>The correlation between hours and score is <i>r</i> = 0.72.`}},
mc:[
/* ---------- Unit 1 ---------- */
{u:1,calc:"no",q:"A school nurse records the following variables for each student. Which one is a quantitative variable?",ch:["Time, in seconds, for the student to run one mile","Number on the student's sports jersey","Blood type of the student","Zip code of the student's home"],a:0,ex:"A quantitative variable takes numerical values for which arithmetic (such as an average) makes sense. A mile time in seconds can be averaged. Zip codes and jersey numbers are labels: averaging them is meaningless, so they are categorical, like blood type."},
{u:1,calc:"no",q:"The distribution of the amount of money spent by customers at a coffee shop has a mean of $8.40 and a median of $6.10. Which shape is most consistent with these values?",ch:["Skewed to the right","Uniform","Symmetric and mound-shaped","Skewed to the left"],a:0,ex:"The mean is pulled toward the long tail. A mean ($8.40) much greater than the median ($6.10) indicates a long right tail: skewed to the right. A few customers who spend a lot raise the mean but not the median."},
{u:1,calc:"help",q:"The five-number summary of the number of text messages sent in one day by a sample of students is: minimum 12, Q1 20, median 25, Q3 30, maximum 52. Using the 1.5 × IQR rule, which statement is true?",ch:["There are no outliers.","Both 12 and 52 are outliers.","12 is an outlier, and there are no high outliers.","52 is an outlier, and there are no low outliers."],a:3,ex:"IQR = 30 − 20 = 10, and 1.5 × IQR = 15. Upper fence = 30 + 15 = 45, lower fence = 20 − 15 = 5. Since 52 > 45, it is a high outlier. Since 12 > 5, it is not a low outlier."},
{u:1,calc:"no",q:"After a difficult test, a teacher adds 4 points to every student's score. Which of the following statistics for the class's scores will NOT change?",ch:["The mean and the median","The standard deviation and the IQR","The mean and the standard deviation","The median and the IQR"],a:1,ex:"Adding a constant to every value shifts measures of center and location (mean, median, quartiles) by that constant but does not change the spread. The standard deviation and the IQR stay the same."},
{u:1,calc:"no",q:"Maya's score on a chemistry test has a z-score of 1.6. Which of the following is the best interpretation?",ch:["Maya scored 1.6 points above the class mean.","Maya scored better than 16% of the class.","Maya's score was 1.6 times the class mean score.","Maya's score was 1.6 standard deviations above the class mean score."],a:3,ex:"A z-score gives the number of standard deviations a value is from the mean. z = 1.6 means Maya's score is 1.6 standard deviations above the mean score of the class. A percentile can't be found without knowing the shape of the distribution."},
{u:1,calc:"no",q:"A principal wants to survey students about a new schedule. She obtains a list of students in each grade (9, 10, 11 and 12) and uses a random number generator to select 25 students from each grade. What type of sample is this?",ch:["Stratified random sample","Simple random sample","Cluster sample","Systematic random sample"],a:0,ex:"The population is divided into groups (strata) by grade, and a simple random sample is taken from every group. That is a stratified random sample. It is not an SRS, because not every group of 100 students could be chosen (for example, 100 seniors could not be)."},
{u:1,calc:"no",q:"A local news website asked readers to vote online on whether the city should build a new stadium. Of the 2,300 people who voted, 78% opposed the stadium. Which is the most important reason the 78% may not represent the opinion of all city residents?",ch:["The sample size is too small.","The question was worded in a leading way.","Undercoverage: the website did not reach any residents.","Voluntary response: people with strong opinions are more likely to respond."],a:3,ex:"People chose whether to respond, so this is a voluntary response sample. Those with strong (often negative) opinions are most likely to participate, so the result is likely biased. A larger sample does not fix bias. Nothing in the description indicates leading wording."},
{u:1,calc:"no",q:"Researchers compare two diets for weight loss. They separate the 60 volunteers into men and women, then randomly assign half of each sex to Diet A and the other half to Diet B. What is the main purpose of separating the volunteers by sex?",ch:["To create a placebo group","To eliminate the need for random assignment","To make the results generalize to all adults","To reduce variability in the response due to sex so that diet differences are easier to detect"],a:3,ex:"This is a randomized block design with sex as the blocking variable. Blocking accounts for variation in weight loss caused by sex, which makes the comparison of diets more precise. Random assignment still happens within each block. Generalization depends on how subjects were selected, not on blocking."},
{u:1,calc:"no",q:"An observational study found that adults who drink more coffee tend to have higher blood pressure. Which statement is correct?",ch:["The study cannot show cause and effect, because other variables (such as stress or smoking) could be associated with both coffee drinking and blood pressure.","The study cannot show any association between the variables.","The study would show cause and effect if the sample were larger.","The study shows that coffee causes higher blood pressure."],a:0,ex:"Without random assignment of treatments, a causal conclusion can't be drawn: confounding variables such as stress or smoking may be related to both coffee consumption and blood pressure. A larger sample does not remove confounding. The study does show an association."},
{u:1,calc:"no",q:"A random sample of 200 students at Lincoln High School was asked how many hours they sleep on school nights. Students who play a sport reported less sleep on average than those who don't. To which group can the results be generalized, and what kind of conclusion is justified?",ch:["Students at Lincoln High School; playing a sport causes less sleep","Students at Lincoln High School; there is an association between playing a sport and sleep, but not necessarily causation","All high school students; playing a sport causes less sleep","All high school students; there is an association but not causation"],a:1,ex:"Random selection from Lincoln High School allows generalization to students at Lincoln High School only, not to all high school students. No treatments were randomly assigned (students chose to play sports), so only an association, not causation, is justified."},
/* ---------- Unit 2 ---------- */
{u:2,calc:"no",q:"A basketball player makes 70% of her free throws. To simulate her free throws with a random digit table, which assignment of digits is correct?",ch:["0–6 = make, 7–9 = miss","0–7 = make, 8–9 = miss","0–2 = make, 3–9 = miss","0–6 = miss, 7–9 = make"],a:0,ex:"Each of the 10 digits is equally likely, so each has probability 0.1. Assigning 7 digits (0–6) to “make” gives P(make) = 0.7. B gives 0.8, and C and D give 0.3 for a make."},
{u:2,calc:"help",q:"The random variable X is the number of pets in a randomly selected household in a town. Its probability distribution is shown.<table class='tb'><tr><th>x</th><td>0</td><td>1</td><td>2</td><td>3</td></tr><tr><th>P(X = x)</th><td>0.3</td><td>0.4</td><td>0.2</td><td>0.1</td></tr></table>What is the expected value of X?",ch:["0.25","1.00","1.10","1.50"],a:2,ex:"E(X) = Σ x·P(x) = 0(0.3) + 1(0.4) + 2(0.2) + 3(0.1) = 0 + 0.4 + 0.4 + 0.3 = 1.10 pets. 1.50 is the average of the values 0–3, which ignores the probabilities."},
{u:2,calc:"rec",q:"Twenty percent of customers at a store use a coupon. A random sample of 10 customers is selected. Assuming customers' coupon use is independent, what is the probability that exactly 2 use a coupon?",ch:["0.040","0.200","0.302","0.678"],a:2,ex:"X ~ Binomial(n = 10, p = 0.2). P(X = 2) = C(10,2)(0.2)²(0.8)⁸ = 45(0.04)(0.16777) ≈ 0.302. 0.678 is P(X ≤ 2) and 0.040 is (0.2)² only."},
{u:2,calc:"rec",q:"The heights of adult women in a country are approximately normally distributed with mean 64 inches and standard deviation 2.5 inches. What proportion of women in the country are taller than 68 inches?",ch:["0.055","0.160","0.445","0.945"],a:0,ex:"z = (68 − 64)/2.5 = 1.6. P(Z > 1.6) = 1 − 0.9452 = 0.0548 ≈ 0.055. 0.945 is the proportion shorter than 68 inches."},
{u:2,set:"P",calc:"no",q:"What is the probability that the student uses an Android phone, given that the student is an upperclassman?",ch:["0.20","0.35","0.40","0.57"],a:2,ex:"Conditioning on upperclass restricts attention to the 200 upperclass students. P(Android | upperclass) = 80/200 = 0.40. 0.20 = 80/400 is P(Android and upperclass); 0.57 = 80/140 is P(upperclass | Android)."},
{u:2,set:"P",calc:"no",q:"What is the probability that the student uses an iPhone or is an upperclassman?",ch:["0.55","0.75","0.80","1.05"],a:2,ex:"P(iPhone ∪ upper) = P(iPhone) + P(upper) − P(iPhone ∩ upper) = 220/400 + 200/400 − 100/400 = 320/400 = 0.80. Adding without subtracting the overlap gives 1.05, which is impossible for a probability."},
{u:2,set:"P",calc:"no",q:"Are the events “uses an iPhone” and “is an underclassman” independent?",ch:["Yes, because both groups contain 200 students","Yes, because P(iPhone) = P(underclass)","No, because the events are mutually exclusive","No, because P(iPhone | underclass) = 0.60, which is not equal to P(iPhone) = 0.55"],a:3,ex:"Events A and B are independent if P(A | B) = P(A). P(iPhone | underclass) = 120/200 = 0.60, but P(iPhone) = 220/400 = 0.55. The probabilities differ, so the events are not independent. They are not mutually exclusive: 120 students are in both."},
{u:2,calc:"no",q:"Events A and B have P(A) = 0.3 and P(B) = 0.5, and A and B are mutually exclusive. Which statement must be true?",ch:["P(A and B) = 0.15","A and B are not independent.","A and B are independent.","P(A or B) = 0.65"],a:1,ex:"Mutually exclusive means P(A and B) = 0. If they were independent, P(A and B) would equal 0.3 × 0.5 = 0.15 ≠ 0. So mutually exclusive events with positive probabilities can never be independent. P(A or B) = 0.3 + 0.5 = 0.8."},
{u:2,calc:"help",q:"The population of weekly hours worked by employees of a large company has mean 50 hours and standard deviation 12 hours. The distribution is skewed to the right. A random sample of 36 employees is selected. Which best describes the sampling distribution of the sample mean x̄?",ch:["Skewed right with mean 50 and standard deviation 12","Approximately normal with mean 50 and standard deviation 12","Skewed right with mean 50 and standard deviation 2","Approximately normal with mean 50 and standard deviation 2"],a:3,ex:"By the central limit theorem, with n = 36 the sampling distribution of x̄ is approximately normal even though the population is skewed. Its mean is μ = 50 and its standard deviation is σ/√n = 12/√36 = 2."},
/* ---------- Unit 3 ---------- */
{u:3,calc:"no",q:"In a random sample of 500 registered voters in a state, 46% said they approve of the governor. In this context, which is the parameter?",ch:["The proportion of all registered voters in the state who approve of the governor","500","46%","The proportion of the 500 sampled voters who approve of the governor"],a:0,ex:"A parameter describes the population: the proportion of ALL registered voters in the state who approve. The 46% describes the sample, so it is a statistic (p̂), which estimates the parameter."},
{u:3,calc:"help",q:"Suppose 30% of all students at a large university live off campus. Random samples of 100 students are taken. What are the mean and standard deviation of the sampling distribution of the sample proportion p̂ who live off campus?",ch:["Mean 0.30, standard deviation 0.021","Mean 0.30, standard deviation 0.046","Mean 30, standard deviation 4.58","Mean 0.30, standard deviation 0.458"],a:1,ex:"μ(p̂) = p = 0.30. σ(p̂) = √[p(1 − p)/n] = √[(0.3)(0.7)/100] = √0.0021 ≈ 0.046. 0.021 is the variance-like value 0.0021 misread; 0.458 is √0.21 without dividing by n."},
{u:3,calc:"no",q:"A 95% confidence interval for the proportion of all adults in a city who own a bicycle is (0.31, 0.39). Which is the correct interpretation of 95% confidence?",ch:["There is a 95% probability that the true proportion is between 0.31 and 0.39.","95% of adults in the city own between 31% and 39% of a bicycle.","If many random samples were taken and a 95% interval computed from each, about 95% of those intervals would capture the true proportion of adults in the city who own a bicycle.","95% of all sample proportions will be between 0.31 and 0.39."],a:2,ex:"The confidence level describes the method's long-run capture rate. Once an interval is calculated, the parameter is either in it or not, so A is incorrect. D confuses the interval with the sampling distribution."},
{u:3,calc:"no",q:"A researcher plans a confidence interval for a population proportion. If she increases the sample size from 250 to 1,000 and keeps the same confidence level, the margin of error will be approximately",ch:["one-fourth as large","one-half as large","the same","twice as large"],a:1,ex:"The margin of error is z*·√[p̂(1 − p̂)/n], proportional to 1/√n. Multiplying n by 4 divides the margin of error by √4 = 2, so it becomes about half as large."},
{u:3,calc:"rec",q:"A company claims that 50% of customers prefer its new package design. In a random sample of 400 customers, 224 (56%) preferred the new design. What is the value of the test statistic for testing H₀: p = 0.5 against Hₐ: p > 0.5?",ch:["z = 0.12","z = 1.20","z = 2.40","z = 2.42"],a:2,ex:"z = (p̂ − p₀)/√[p₀(1 − p₀)/n] = (0.56 − 0.50)/√[(0.5)(0.5)/400] = 0.06/0.025 = 2.40. The standard deviation in a test uses p₀, not p̂; using p̂ gives about 2.42, which is incorrect."},
{u:3,calc:"no",q:"In the test in the previous question, the p-value is about 0.008. Which is the correct interpretation of the p-value?",ch:["There is a 0.008 probability that the company's claim is true.","If more than 50% prefer the new design, there is a 0.008 probability of getting a sample proportion of 0.56.","There is a 0.008 probability that 56% of customers prefer the new design.","Assuming 50% of all customers prefer the new design, there is a 0.008 probability of getting a sample proportion of 0.56 or greater by chance in a random sample of 400 customers."],a:3,ex:"A p-value is calculated assuming H₀ is true. It is the probability of a statistic as extreme as or more extreme than the observed one (in the direction of Hₐ). It is not the probability that a hypothesis is true."},
{u:3,calc:"no",q:"A factory tests H₀: p = 0.02 versus Hₐ: p > 0.02, where p is the proportion of all items produced today that are defective. If the test indicates p > 0.02, production is stopped. Which describes a Type II error?",ch:["Stopping production when the true defect rate is 0.02","Stopping production when the true defect rate is greater than 0.02","Not stopping production when the true defect rate is greater than 0.02","Not stopping production when the true defect rate is 0.02"],a:2,ex:"A Type II error is failing to reject H₀ when Hₐ is true. Here that means concluding the defect rate is not too high (keep running) when in fact the defect rate is greater than 0.02. Choice A is a Type I error."},
{u:3,calc:"help",q:"In a test of independence, a random sample of 400 adults was classified by age group (3 categories) and preferred news source (4 categories). In the table, the row total for adults aged 18–34 is 200 and the column total for “social media” is 220. What is the expected count for adults aged 18–34 who prefer social media, and how many degrees of freedom does the test have?",ch:["Expected count 110, df = 6","Expected count 110, df = 12","Expected count 55, df = 6","Expected count 200, df = 11"],a:0,ex:"Expected count = (row total)(column total)/(grand total) = (200)(220)/400 = 110. df = (rows − 1)(columns − 1) = (3 − 1)(4 − 1) = 6."},
{u:3,calc:"no",q:"Researchers compared the proportion of residents in two towns who recycle. A 95% confidence interval for p₁ − p₂ (Town 1 minus Town 2) is (−0.04, 0.10). Which conclusion is appropriate?",ch:["Town 1 has a higher recycling rate because most of the interval is positive.","Because 0 is in the interval, the two towns definitely have the same recycling rate.","Because 0 is in the interval, the data do not provide convincing evidence of a difference in the population proportions of residents who recycle.","Town 2 has a higher recycling rate because the interval includes negative values."],a:2,ex:"0 is a plausible value for p₁ − p₂, so there is no convincing evidence of a difference. That does not mean the proportions are equal (B), since other plausible values are not 0."},
/* ---------- Unit 4 ---------- */
{u:4,calc:"no",q:"When constructing a confidence interval for a population mean μ, why do we usually use a t critical value instead of z?",ch:["Because t gives a narrower interval","Because the sample size is small","Because the population is not normal","Because the population standard deviation σ is unknown and is estimated by the sample standard deviation s"],a:3,ex:"Using s in place of the unknown σ adds variability, which the t-distribution accounts for with heavier tails. This is true for any sample size. t intervals are wider than z intervals, not narrower."},
{u:4,calc:"rec",q:"A random sample of 16 bags of trail mix has mean weight x̄ = 72 grams and standard deviation s = 8 grams. The distribution of weights shows no strong skewness or outliers. Which is a 95% confidence interval for the mean weight of all bags of this trail mix?",ch:["(68.08, 75.92)","(67.74, 76.26)","(56.0, 88.0)","(70.0, 74.0)"],a:1,ex:"df = 15, t* = 2.131. SE = s/√n = 8/√16 = 2. Interval: 72 ± 2.131(2) = 72 ± 4.26 = (67.74, 76.26). A uses z* = 1.96, which is incorrect because σ is unknown."},
{u:4,calc:"no",q:"Which of the following studies should be analyzed with a paired t procedure?",ch:["Comparing mean test scores of a random sample of juniors and an independent random sample of seniors","Comparing each student's reaction time with the right hand and with the left hand","Comparing the proportion of men and women who exercise","Comparing mean incomes in two different cities using two random samples"],a:1,ex:"Paired data arise when each observation in one group is naturally matched with one in the other, as when the same student is measured twice. The analysis then uses the differences. A and D are independent samples (two-sample t), and C is about proportions."},
{u:4,calc:"no",q:"A random sample of 12 batteries is used to construct a t interval for the mean lifetime of all batteries of this brand. Because the sample size is less than 30, which condition must be checked?",ch:["The population standard deviation is known.","The sample size is at least 10% of the population.","At least 10 successes and 10 failures in the sample","The sample data show no strong skewness or outliers, so a normal population is plausible."],a:3,ex:"For small samples the t procedure requires the population distribution to be approximately normal. We check this with a graph of the sample data: no strong skewness or outliers. The 10% condition is an upper limit (n ≤ 10% of population), not a minimum, and successes/failures apply to proportions."},
{u:4,calc:"no",q:"A significance test about a population mean gives a p-value of 0.03. Which of the following is correct?",ch:["Reject H₀ at α = 0.05 and at α = 0.01","Reject H₀ at α = 0.05 but not at α = 0.01","Reject H₀ at α = 0.01 but not at α = 0.05","Fail to reject H₀ at both α = 0.05 and α = 0.01"],a:1,ex:"Reject H₀ when the p-value is less than α. 0.03 < 0.05, so reject at the 5% level. 0.03 > 0.01, so fail to reject at the 1% level."},
{u:4,calc:"no",q:"Forty volunteers were randomly assigned to study with music or in silence, and their memory test scores were compared with a two-sample t-test. The p-value was 0.21. Which conclusion is correct at α = 0.05?",ch:["Studying with music has no effect on memory scores.","We accept the null hypothesis that the mean scores are equal.","There is not convincing evidence that the true mean memory score differs between studying with music and in silence for volunteers like these.","There is convincing evidence that music lowers memory scores."],a:2,ex:"Since 0.21 > 0.05, we fail to reject H₀. That means the data do not provide convincing evidence of a difference. It does not prove there is no effect (A) and we never “accept” H₀ (B)."},
{u:4,calc:"help",q:"A random sample of 50 households in Town A had mean monthly electricity use of 820 kWh (s = 140). An independent random sample of 60 households in Town B had mean 760 kWh (s = 160). What is the standard error of x̄_A − x̄_B?",ch:["About 9.2","About 28.6","About 150","About 4.4"],a:1,ex:"SE = √(s_A²/n_A + s_B²/n_B) = √(140²/50 + 160²/60) = √(392 + 426.7) = √818.7 ≈ 28.6. The standard deviations are not added directly."},
/* ---------- Unit 5 ---------- */
{u:5,calc:"no",q:"A researcher found the correlation between temperature (in °F) and ice cream sales (in dollars) to be r = 0.85. If temperature is converted to °C, what is the new correlation?",ch:["0.47","1.53","0.85","It cannot be determined without the data."],a:2,ex:"Correlation has no units and is unchanged by linear changes of units (such as °F to °C, which is a linear transformation with a positive slope)."},
{u:5,calc:"no",q:"A residual plot for a least-squares regression line shows residuals that are positive for small x, negative for middle x, and positive for large x (a U-shaped pattern). What does this indicate?",ch:["A linear model is not appropriate because the relationship appears curved.","The linear model is appropriate because the residuals sum to zero.","The correlation is close to 0.","There are no influential points."],a:0,ex:"A residual plot should show random scatter for a linear model to be appropriate. A clear curved (U-shaped) pattern means the line systematically underpredicts and overpredicts, so the relationship is nonlinear."},
{u:5,calc:"help",q:"For a set of data, x̄ = 10, s_x = 2, ȳ = 50, s_y = 8, and r = 0.6. What is the equation of the least-squares regression line?",ch:["ŷ = 47 + 0.15x","ŷ = 26 + 2.4x","ŷ = 50 + 2.4x","ŷ = 2.4 + 26x"],a:1,ex:"b = r(s_y/s_x) = 0.6(8/2) = 2.4. The line passes through (x̄, ȳ): a = ȳ − b·x̄ = 50 − 2.4(10) = 26. So ŷ = 26 + 2.4x."},
{u:5,calc:"no",q:"A regression of weight (kg) on age (months) for children aged 1–24 months gives predicted weight = 3.9 + 0.45(age). Why should it not be used to predict the weight of a 15-year-old (180 months)?",ch:["The slope is too small.","Weight is not a quantitative variable.","The intercept is not 0.","180 months is far outside the range of ages used to build the model, so predicting there is unreliable extrapolation."],a:3,ex:"Predictions for x-values outside the range of the data (extrapolation) assume the linear pattern continues, which is often false. Growth slows dramatically after infancy."},
{u:5,set:"R",calc:"no",q:"Which is the correct interpretation of the slope of the regression line?",ch:["Each additional hour of studying causes the score to increase by 3.8 points.","For each additional hour spent studying, the predicted test score increases by 3.8 points.","The test score is 3.8 for a student who studies 0 hours.","For each 1-point increase in score, hours studied increases by 3.8."],a:1,ex:"The slope gives the change in the PREDICTED response per one-unit increase in x. The data are observational, so causal language (A) is not justified. C confuses slope with intercept (45.2)."},
{u:5,set:"R",calc:"no",q:"A student in the sample studied 6 hours and scored 63. What is the residual for this student?",ch:["−5.0","5.0","68.0","−22.8"],a:0,ex:"Predicted score = 45.2 + 3.8(6) = 68.0. Residual = actual − predicted = 63 − 68.0 = −5.0. The student scored 5 points lower than predicted."},
{u:5,set:"R",calc:"help",q:"Which is the correct interpretation of the coefficient of determination for this model?",ch:["About 52% of the variation in test scores is accounted for by the linear relationship between test score and hours studied.","About 72% of the test scores are correctly predicted.","About 52% of students who studied more scored higher.","The predicted score is correct 72% of the time."],a:0,ex:"r² = (0.72)² ≈ 0.518. About 51.8% of the variation in test scores is accounted for (explained) by the linear relationship with hours spent studying."},
]
,
frq:[
{id:1,type:"Multi-Focus: Practices 1 & 2 (Formulate Questions, Collect Data)",title:"Bike lanes survey",calc:"no",
stem:`<p>The city council of Riverton (population 48,000 adults) is considering adding protected bike lanes on Main Street. The council wants to know what proportion of adult residents of Riverton support the bike lanes. Riverton has four neighborhoods: North, South, East and West. Residents of the West neighborhood live closest to Main Street. The council has a list of all adult residents, with the neighborhood of each one.</p>`,
parts:[
{id:"a",q:"Identify the population and the variable of interest for the council's question. State whether the variable is categorical or quantitative.",
 pts:[{id:"1a1",t:"Population",earn:"Identifies the population as <b>all adult residents of Riverton</b>.",not:"“Residents” with no place, “people in the survey”, “the sample”, “people who use Main Street”, or “the 48,000” with no description.",need:[[/riverton|city|town/,"Name the population specifically: all adult residents of Riverton."]]},
      {id:"1a2",t:"Variable and type",earn:"Identifies the variable as <b>whether a resident supports the bike lanes (yes/no)</b> and states that it is <b>categorical</b>.",not:"Calls it quantitative; names the proportion (that is the parameter, not the variable); or names the variable without its type.",req:[[/categorical/,"The type of the variable (categorical) is not stated."]],forbid:[[/\bis\s+(a\s+)?quantitative/,"Support (yes/no) is categorical, not quantitative."]]}],
 model:"The population is all adults who live in Riverton. The variable is whether an adult resident supports the protected bike lanes on Main Street (yes or no), which is categorical."},
{id:"b",q:"Describe how the council could select a stratified random sample of 400 adult residents. Explain why stratifying by neighborhood could be beneficial in this context.",
 pts:[{id:"1b1",t:"Strata",earn:"Uses the <b>neighborhoods</b> (North, South, East, West) as strata.",not:"Strata that are not described, or treating neighborhoods as clusters (randomly choosing whole neighborhoods).",need:[[/neighbou?rhood/,"Say that the strata are the four neighborhoods."]]},
      {id:"1b2",t:"Random selection mechanism",earn:"Describes a <b>random mechanism</b> that can be carried out: e.g., number the residents in each neighborhood from the list 1 to N, use a random number generator to choose distinct numbers (ignore repeats), and survey those residents.",not:"Only says “randomly select” or “pick residents at random” with no method; selecting people on the street, by convenience, or by volunteering; failing to address repeats; drawing names without describing how names are mixed.",need:[[/random\s*(number|integer|digit)|randint|names?\s+(in|into|from)\s+a\s+hat|generator/,"Describe the random mechanism (for example, a random number generator on the numbered list)."]]},
      {id:"1b3",t:"Reason for stratifying (in context)",earn:"Explains that residents within a neighborhood are likely to have <b>similar opinions</b> (e.g., West residents, closest to Main Street, may differ), so stratifying gives a <b>more precise estimate</b> (less variability) and ensures every neighborhood is represented.",not:"Only “it is more accurate” or “it is fair” with no link to opinions differing by neighborhood; saying stratifying removes bias from nonresponse.",need:[[/similar|differ|opinion|homogeneous|vary/,"Explain that opinions likely differ between neighborhoods (similar within), in context."]]}],
 model:"Use the four neighborhoods as strata. Using the council's list, number the adult residents of each neighborhood (for example, North 1 to N₁). Use a random number generator to select 100 different numbers from each neighborhood's list, ignoring repeats, and survey those residents. (Selecting in proportion to each neighborhood's size is also acceptable.) Stratifying is helpful because residents in the same neighborhood, especially in the West near Main Street, are likely to have similar views about the bike lanes, while views may differ between neighborhoods. Stratifying ensures each neighborhood is represented and gives a more precise estimate of the proportion of all adult residents who support the lanes."},
{id:"c",q:"The council mails the survey to the selected residents. Only 38% return it. Describe a possible source of bias and explain how it would likely affect the council's estimate.",
 pts:[{id:"1c1",t:"Nonresponse bias identified",earn:"Identifies <b>nonresponse bias</b>: residents who did not return the survey may have different opinions from those who did.",not:"Calls it voluntary response bias (the residents were chosen at random), undercoverage, or “the sample is too small”.",req:[[/non-?\s?response|did\s?n[o']t\s+(return|respond)|not\s+(return|respond)/,"Name nonresponse bias (selected residents who did not respond)."]]},
      {id:"1c2",t:"Direction, with reason in context",earn:"States a <b>direction</b> (overestimate or underestimate) with a <b>reason</b>: e.g., residents who strongly oppose losing parking or traffic lanes are more motivated to return the survey, so the estimate of support would likely be too low.",not:"No direction; a direction without explaining why responders differ from nonresponders.",need:[[/over|under|too (high|low)|higher|lower/,"State whether the estimate would be too high or too low, and why."]]}],
 model:"Nonresponse bias: 62% of the randomly selected residents did not return the survey, and they may differ from those who did. For example, residents with strong feelings, such as those who oppose losing parking on Main Street, are more motivated to return it. If so, the proportion who support the lanes would likely be underestimated."},
{id:"d",q:"A local news site posted an online poll, and 1,250 readers voted: 71% opposed the bike lanes. A council member says, “This large sample shows most Riverton adults oppose the lanes.” Explain why this conclusion is not justified.",
 pts:[{id:"1d1",t:"Voluntary response",earn:"Identifies a <b>voluntary response</b> sample: readers chose to take part, and people with strong (often negative) opinions are most likely to respond.",not:"Only “it isn't random” with no explanation of who responds; only “the sample size is too small”.",need:[[/voluntar|chose|self-?select|opt/,"Explain that participants chose themselves (voluntary response)."]]},
      {id:"1d2",t:"Sample size does not fix bias / population",earn:"Explains that a <b>large sample does not remove bias</b>, or that the respondents are news-site readers, not a random sample of <b>all Riverton adults</b>, so results cannot be generalized to them.",not:"Saying the result would be valid with a larger sample.",need:[[/large|size|all\s+(adult|resident)|population|generali/,"Address the large sample size or the population (all Riverton adults)."]]}],
 model:"The poll is a voluntary response sample: readers decided whether to vote, and people with strong opinions, often opponents, are most likely to participate. The respondents are not a random sample of all adult residents of Riverton (some may not even live there). A large sample does not remove this bias, so the 71% cannot be generalized to all Riverton adults."},
{id:"e",q:"A council member notes that streets in nearby cities that have bike lanes have fewer car accidents than streets without them, and concludes that bike lanes cause fewer accidents. Identify a possible confounding variable and explain how it could provide an alternative explanation.",
 pts:[{id:"1e1",t:"Confounding variable",earn:"Names a plausible confounding variable and explains how it is related to <b>both</b> having bike lanes <b>and</b> the number of accidents (e.g., streets with bike lanes tend to be newer or residential, with lower speed limits and less traffic, which also leads to fewer accidents).",not:"A variable related to only one of the two; only saying “correlation is not causation”; a variable with no explanation.",need:[[/traffic|speed|wid|new|residential|volume|lighting|budget|income/,"Name a specific variable and link it to both bike lanes and accidents."]]}],
 model:"Traffic volume is a possible confounding variable. Cities tend to add bike lanes on quieter streets with lower traffic volume, and streets with less traffic also have fewer car accidents. The difference in accidents might be due to traffic volume rather than the bike lanes, so this observational comparison cannot show that bike lanes cause fewer accidents."}]},

{id:2,type:"Multi-Focus: Practices 3 & 4 (Analyze Data, Interpret Results)",title:"Commute times",calc:"rec",
stem:`<p>Random samples of 40 students were selected from each of two high schools, and each student reported the number of minutes of their usual morning commute.</p>
<table class="tb"><tr><th></th><th>n</th><th>Mean</th><th>Min</th><th>Q1</th><th>Median</th><th>Q3</th><th>Max</th></tr>
<tr><th>School A</th><td>40</td><td>20.4</td><td>6</td><td>15</td><td>19</td><td>25</td><td>44</td></tr>
<tr><th>School B</th><td>40</td><td>24.3</td><td>10</td><td>20</td><td>24</td><td>28</td><td>41</td></tr></table>`,
parts:[
{id:"a",q:"Compare the distributions of commute time for the two samples.",
 pts:[{id:"2a1",t:"Center",earn:"States that the <b>median</b> (or mean) commute for School B (24 min) is <b>greater</b> than for School A (19 min), using numbers, <b>in context</b>.",not:"Only lists both medians without comparing (“A is 19, B is 24”); no context (commute time).",need:[[/(greater|higher|larger|more|longer|less|lower|smaller|shorter)/,"Use comparative language (e.g., “greater than”), not just a list of values."],[/commut|minute|time/,"Include context (commute time)."]]},
      {id:"2a2",t:"Variability",earn:"States that School A has <b>more variability</b>, with evidence: IQR 10 vs 8 minutes, or range 38 vs 31 minutes.",not:"Uses the means or medians to compare variability; lists IQRs without a comparison.",need:[[/iqr|range|spread|variab/,"Compare variability with the IQR or range."]]},
      {id:"2a3",t:"Shape (with evidence)",earn:"Describes School A as <b>skewed right</b> AND gives evidence (median − Q1 = 4 < Q3 − median = 6, or mean 20.4 > median 19, or the long upper whisker), and describes School B as roughly <b>symmetric</b> with evidence (Q1 and Q3 each 4 from the median; mean ≈ median).",not:"Only “A is skewed right” with no evidence from the summary statistics, or describing only one school.",need:[[/skew/,"Describe the shape (skewed/symmetric) of each distribution."],[/symmetric/,"Describe the shape of School B (roughly symmetric)."]]}],
 model:"Center: the median commute at School B (24 minutes) is greater than the median at School A (19 minutes). Variability: School A's commute times are more variable: IQR 25 − 15 = 10 minutes versus 28 − 20 = 8 minutes, and range 38 versus 31 minutes. Shape: School A appears skewed to the right, since the distance from the median to Q3 (6) is greater than from Q1 to the median (4), the mean (20.4) exceeds the median (19) and the maximum is far above Q3. School B appears roughly symmetric: Q1 and Q3 are both 4 minutes from the median and the mean (24.3) is close to the median (24)."},
{id:"b",q:"Is the maximum commute time at School A (44 minutes) an outlier? Justify your answer.",
 pts:[{id:"2b1",t:"Fences with work",earn:"Computes IQR = 25 − 15 = 10 and the <b>upper fence</b> Q3 + 1.5(IQR) = 25 + 15 = 40, showing the work.",not:"States a fence with no work, uses the wrong quartiles, or uses 2 standard deviations instead of the 1.5 × IQR rule without justification.",need:[[/40/,"Show the upper fence: 25 + 1.5(10) = 40."]]},
      {id:"2b2",t:"Conclusion",earn:"Concludes that <b>44 is an outlier</b> because 44 > 40.",not:"A conclusion that does not follow from a correctly computed fence, or a conclusion with no comparison to the fence.",need:[[/outlier/,"State clearly whether 44 is an outlier."]]}],
 model:"IQR = 25 − 15 = 10 minutes. Upper fence = Q3 + 1.5(IQR) = 25 + 1.5(10) = 40 minutes. Since 44 > 40, the maximum commute of 44 minutes is an outlier."},
{id:"c",q:"District records show that the commute times for <b>all</b> students at School B are approximately normally distributed with mean 24 minutes and standard deviation 6 minutes. Find the probability that a randomly selected School B student has a commute longer than 30 minutes. Show your work.",
 pts:[{id:"2c1",t:"Distribution named with parameters",earn:"Identifies the <b>normal distribution</b> with mean <b>μ = 24</b> and standard deviation <b>σ = 6</b> (e.g., X ~ N(24, 6)) and the boundary 30 with the direction (greater than), or a correct z = (30 − 24)/6 = 1.",not:"Uses <b>s</b> or <b>x̄</b> for the population standard deviation or mean (these are population values: σ and μ); calculator syntax only, such as normalcdf(30, 1000, 24, 6), with no labels.",forbid:[[/\bs\s*=\s*6\b/,"s is a sample standard deviation. These are population values, so the standard deviation is σ = 6."],[/x̄\s*=\s*24|x-?bar\s*=\s*24/,"x̄ is a sample mean. These are population values: μ = 24."]],need:[[/normal|n\s*\(|z\s*=/,"Name the normal distribution and its parameters (μ = 24, σ = 6), or show the z-score."]]},
      {id:"2c2",t:"Correct probability",earn:"P(X > 30) = P(Z > 1) ≈ <b>0.1587</b> (0.159 or 0.16 also earns).",not:"0.8413 (the area to the left); a probability with no supporting work from the first point.",need:[[/0?\.159|0?\.1587|0?\.16\b/,"The probability should be about 0.159."]]}],
 model:"Let X = commute time of a randomly selected School B student. X ~ Normal(μ = 24, σ = 6). z = (30 − 24)/6 = 1.00. P(X > 30) = P(Z > 1.00) = 1 − 0.8413 = 0.1587."},
{id:"d",q:"Four School B students are selected at random. Find the probability that exactly one of them has a commute longer than 30 minutes.",
 pts:[{id:"2d1",t:"Binomial named with parameters",earn:"Identifies a <b>binomial</b> random variable with <b>n = 4</b> and <b>p = 0.1587</b> (or uses C(4,1)(0.1587)(0.8413)³).",not:"Calculator syntax only, such as binompdf(4, .1587, 1), with no labels; using p = 0.8413 or n = 1.",need:[[/binom|c\s*\(\s*4|4\s*c\s*1|4\s*\(\s*0?\.1587/,"Name the binomial distribution with n = 4 and p = 0.1587, or show the formula."]]},
      {id:"2d2",t:"Correct probability",earn:"P(Y = 1) ≈ <b>0.378</b> (consistent with the student's answer to part (c) is acceptable).",not:"0.1587 × 0.8413³ ≈ 0.0945 (missing the 4 arrangements).",need:[[/0?\.378/,"The probability should be about 0.378 (or consistent with your part (c))."]]}],
 model:"Let Y = number of the 4 students with a commute longer than 30 minutes. Y ~ Binomial(n = 4, p = 0.1587). P(Y = 1) = C(4,1)(0.1587)¹(0.8413)³ = 4(0.1587)(0.5955) ≈ 0.378."},
{id:"e",q:"Using the distribution in part (c), find and interpret the z-score of a School B student whose commute is 33 minutes.",
 pts:[{id:"2e1",t:"z-score and interpretation",earn:"z = (33 − 24)/6 = <b>1.5</b>, and interprets: this commute is <b>1.5 standard deviations above the mean</b> commute time for School B students.",not:"Interprets as “1.5 minutes above the mean” or “at the 1.5th percentile”; no context.",req:[[/1\.5/,"The z-score should be 1.5."]],need:[[/standard deviation|sd|σ/,"Interpret in standard deviations above the mean, in context."]]}],
 model:"z = (33 − 24)/6 = 1.5. A commute of 33 minutes is 1.5 standard deviations above the mean commute time for students at School B."}]},

{id:3,type:"Inference",title:"Meditation app experiment",calc:"rec",
stem:`<p>A sleep researcher recruited 240 adult volunteers who reported mild insomnia. The volunteers were randomly assigned to one of two groups of 120. One group used a guided-meditation app each night for four weeks; the other group received a pamphlet about good sleep habits. At the end of four weeks, each volunteer was classified as improved or not improved based on a sleep-quality questionnaire.</p>
<table class="tb"><tr><th></th><th>Improved</th><th>Not improved</th><th>Total</th></tr><tr><th>Meditation app</th><td>66</td><td>54</td><td>120</td></tr><tr><th>Pamphlet</th><td>48</td><td>72</td><td>120</td></tr></table>`,
parts:[
{id:"a",q:"Do the data provide convincing evidence, at the α = 0.05 level, that the proportion of volunteers like these who would improve is greater with the meditation app than with the pamphlet? Complete the appropriate inference procedure: state hypotheses (defining parameters), identify the procedure and check conditions, calculate the test statistic and p-value, and state a conclusion.",
 pts:[{id:"3a1",t:"Parameters defined",earn:"Defines <b>p_M</b> and <b>p_P</b> as the <b>true (population) proportions</b> of volunteers like these who would improve with the meditation app and with the pamphlet.",not:"Defines parameters as sample proportions (“the proportion of the 120 who improved”); no definition; uses p̂ in the definition.",need:[[/true|population|all|would improve|like these/,"Define the parameters as true/population proportions, not sample proportions."]]},
      {id:"3a2",t:"Hypotheses",earn:"H₀: p_M = p_P (or p_M − p_P = 0) and Hₐ: p_M &gt; p_P (or p_M − p_P &gt; 0).",not:"Hypotheses with p̂ or numbers from the sample; a two-sided or reversed alternative; “≥” in H₀ with no equality version; hypotheses stated in words with no parameters.",forbid:[HSTAT],need:[[/h\s*[aₐ]|alternative/,"State both hypotheses with parameters."]]},
      {id:"3a3",t:"Procedure named",earn:"Names a <b>two-sample z-test for a difference in proportions</b> (two-proportion z-test).",not:"A t-test, a one-sample test, or a confidence interval. Calculator syntax alone (“2-PropZTest”) does not earn the point.",forbid:[[/\bt-?\s?test|2-?\s?samp\s*t/,"This is a test for proportions, so it uses z, not t."]],need:[[/two|2|difference/,"Name the procedure: two-sample z-test for a difference in proportions."]]},
      {id:"3a4",t:"Randomization condition",earn:"States that the volunteers were <b>randomly assigned</b> to the two treatments.",not:"“Random condition met”, “random sample”, or “the data are random” with no reference to random assignment.",need:[[/random(ly)?\s+assign|random\s+assignment/,"Say that the volunteers were randomly assigned to treatments."]]},
      {id:"3a5",t:"Large counts condition",earn:"Checks that expected counts using the pooled proportion are all ≥ 10: 120(0.475) = 57 and 120(0.525) = 63 in each group; or that the observed counts 66, 54, 48, 72 are all ≥ 10.",not:"“n ≥ 30”, “CLT”, or “large sample” with no counts; stating the counts are large with no numbers.",forbid:[[/n\s*[>≥]=?\s*30|\bclt\b|central limit/,"For proportions, n ≥ 30 and the CLT do not establish normality. Check counts ≥ 10."]],need:[[/57|63|66|54|48|72/,"Show the counts (expected 57 and 63, or observed 66, 54, 48, 72) and compare with 10."]]},
      {id:"3a6",t:"Test statistic",earn:"z ≈ <b>2.33</b> (using p̂_c = 114/240 = 0.475 and SE ≈ 0.0645), with work or values shown.",not:"An incorrect z with no work; using the unpooled SE gives about 2.34, which also earns the point only if work is shown.",need:[[/2\.3[2-4]/,"The test statistic should be about z = 2.33."]]},
      {id:"3a7",t:"p-value",earn:"p-value ≈ <b>0.010</b> (one-sided), consistent with the test statistic.",not:"A two-sided p-value (≈ 0.020) for this one-sided alternative.",need:[[/0?\.0099|0?\.010\b|0?\.01\b/,"The p-value should be about 0.010."]]},
      {id:"3a8",t:"Decision with comparison",earn:"Compares the p-value to α and makes a decision: “Because p-value ≈ 0.010 &lt; α = 0.05, we reject H₀.”",not:"Only “p &lt; α” with no decision; a decision with no comparison; “accept Hₐ” with no comparison.",forbid:[ACCEPT],req:[[/reject/,"State a formal decision: reject H₀ (or fail to reject H₀)."]],need:[[/0?\.05/,"Compare the p-value with α = 0.05."]]},
      {id:"3a9",t:"Conclusion in context",earn:"“There is <b>convincing evidence</b> that the true proportion of volunteers like these who would improve is <b>greater</b> with the meditation app than with the pamphlet.” Must be about population parameters, in context, and match Hₐ.",not:"Conclusions about sample proportions (“66 of 120 is more than 48 of 120”); “proves”; “the app works for everyone”; a conclusion not matching the one-sided alternative.",forbid:[ACCEPT],need:[[/convincing evidence|sufficient evidence/,"Use “convincing evidence” language."],[/true|population|volunteers like|would improve/,"Conclude about the true (population) proportions, in context."]],flag:[PROVE]}],
 model:"Let p_M = the true proportion of volunteers like these who would improve with the meditation app, and p_P = the true proportion who would improve with the pamphlet.<br>H₀: p_M = p_P &nbsp; Hₐ: p_M &gt; p_P<br>Procedure: two-sample z-test for a difference in proportions.<br>Conditions: Random: the volunteers were randomly assigned to the two treatments. Large counts: p̂_c = (66 + 48)/240 = 0.475. Expected counts: 120(0.475) = 57 improved and 120(0.525) = 63 not improved in each group, all at least 10.<br>p̂_M = 66/120 = 0.55, p̂_P = 48/120 = 0.40. SE = √[0.475(0.525)(1/120 + 1/120)] ≈ 0.0645. z = (0.55 − 0.40 − 0)/0.0645 ≈ 2.33. p-value = P(Z ≥ 2.33) ≈ 0.010.<br>Because the p-value ≈ 0.010 &lt; α = 0.05, we reject H₀. There is convincing evidence that the true proportion of volunteers like these who would improve is greater with the meditation app than with the pamphlet."},
{id:"b",q:"Based on your conclusion, can the researcher conclude that using the meditation app causes improvement in sleep for all adults with insomnia? Explain.",
 pts:[{id:"3b1",t:"Cause and scope of inference",earn:"States that a <b>causal</b> conclusion is justified because treatments were <b>randomly assigned</b>, BUT the result applies only to <b>volunteers like these</b>, not to all adults with insomnia, because the volunteers were <b>not randomly selected</b>.",not:"Generalizing to all adults with insomnia; denying causation even though there was random assignment; addressing only one of the two issues.",need:[[/random(ly)?\s+assign|random\s+assignment/,"Explain that random assignment allows a cause-and-effect conclusion."],[/volunteer|not\s+random(ly)?\s+select|not\s+a\s+random\s+sample/,"Explain that generalization is limited to volunteers like these (no random selection)."]]}],
 model:"Partly. Because the volunteers were randomly assigned to treatments, we can conclude that the meditation app caused the higher improvement rate. However, the volunteers were not randomly selected from all adults with insomnia, so we can only generalize to volunteers like these (adults with mild insomnia who would volunteer), not to all adults with insomnia."}]},

{id:4,type:"Multi-Focus: Practices 2, 3 & 4 (Collect, Analyze, Interpret)",title:"Screen time and sleep",calc:"help",
stem:`<p>A health researcher selected a random sample of 30 teenagers from a large school district. For each teenager, she recorded the average daily screen time, in hours (<i>x</i>), and the average nightly sleep, in hours (<i>y</i>). The computer output for the least-squares regression is shown.</p>
<table class="tb"><tr><th>Predictor</th><th>Coef</th></tr><tr><td>Constant</td><td>9.12</td></tr><tr><td>Screen time</td><td>−0.42</td></tr></table><p>R-Sq = 58.4% &nbsp; · &nbsp; r = −0.764</p>
<p>The screen times in the sample ranged from 1 hour to 9 hours per day.</p>`,
parts:[
{id:"a",q:"Write the equation of the least-squares regression line, and interpret its slope in context.",
 pts:[{id:"4a0",t:"Equation",earn:"<b>predicted sleep = 9.12 − 0.42(screen time)</b>, or ŷ = 9.12 − 0.42x with x and ŷ defined in context.",not:"“y = 9.12 − 0.42x” (no hat / no “predicted”: the line gives predicted values, not actual ones); variables not defined; slope and intercept switched.",req:[[/predict|ŷ|y\s*-?\s*hat|estimated/,"The response must be PREDICTED: use ŷ or “predicted sleep”, not y."]],need:[[/9\.12/,"Use the intercept 9.12."],[/sleep/,"Define the variables in context."]]},
      {id:"4a1",t:"Slope interpretation",earn:"“For each additional hour of daily screen time, the <b>predicted</b> nightly sleep <b>decreases</b> by 0.42 hours.” (“on average” or “estimated” is also accepted.)",not:"No “predicted” / “on average” language (“sleep decreases by 0.42 hours”); causal language (“each hour of screen time causes …”); wrong direction; no context.",req:[[/predict|on average|estimat|expected/,"A slope interpretation must describe the PREDICTED (or average) response."]],forbid:[[/caus/,"Causal language is not justified for observational data."]],need:[[/0?\.42/,"Use the slope value 0.42."],[/sleep/,"Include context (sleep and screen time)."]]}],
 model:"predicted sleep = 9.12 − 0.42(screen time). For each additional hour of average daily screen time, the predicted average nightly sleep decreases by 0.42 hours."},
{id:"b",q:"Interpret the y-intercept in context. Is it reasonable to interpret it here? Explain.",
 pts:[{id:"4b1",t:"Intercept",earn:"“A teenager with 0 hours of daily screen time has a <b>predicted</b> nightly sleep of 9.12 hours,” AND notes that 0 is outside the observed screen times (1 to 9), so this is an <b>extrapolation</b> and may not be reliable.",not:"No “predicted” language; not addressing whether x = 0 is within the data.",req:[[/predict|on average|estimat|expected/,"The intercept must be stated as a PREDICTED value."]],need:[[/9\.12/,"Use the intercept 9.12."],[/extrapol|outside|range|1\s*(to|-|–)\s*9/,"Comment on whether 0 hours is within the range of the data."]]}],
 model:"A teenager with 0 hours of daily screen time has a predicted nightly sleep of 9.12 hours. This is an extrapolation, because the screen times in the sample ranged from 1 to 9 hours, so the interpretation may not be reliable."},
{id:"c",q:"One teenager in the sample had 5 hours of daily screen time and 6.5 hours of nightly sleep. Calculate and interpret the residual for this teenager.",
 pts:[{id:"4c1",t:"Residual calculated",earn:"Predicted = 9.12 − 0.42(5) = 7.02 hours; residual = 6.5 − 7.02 = <b>−0.52</b> hours.",not:"Predicted − actual (+0.52); no work.",req:[[/[-−–]\s*0?\.52/,"The residual is actual − predicted = −0.52."]]},
      {id:"4c2",t:"Residual interpreted",earn:"“This teenager sleeps 0.52 hours <b>less than predicted</b> by the regression line for a teenager with 5 hours of screen time.”",not:"“less than average”; no context.",need:[[/less than (what is |was )?predicted|below (the )?predict|lower than predicted|overpredict/,"Interpret: the actual sleep is 0.52 hours less than predicted."]]}],
 model:"Predicted sleep = 9.12 − 0.42(5) = 7.02 hours. Residual = actual − predicted = 6.5 − 7.02 = −0.52 hours. This teenager's actual nightly sleep is 0.52 hours less than the sleep predicted by the regression line for a teenager with 5 hours of daily screen time."},
{id:"d",q:"Interpret the value of R-Sq in context. Then explain what you would look for in a residual plot to decide whether the linear model is appropriate.",
 pts:[{id:"4d1",t:"r² interpretation",earn:"“About <b>58.4% of the variation in nightly sleep</b> is accounted for by the linear relationship between sleep and daily screen time.”",not:"“58.4% of the data fall on the line”; “58.4% of sleep is caused by screen time”; leaving out the word variation.",req:[[/variation|variability/,"r² describes the proportion of VARIATION in y accounted for by the model."]],need:[[/58\.4/,"Use 58.4%."]]},
      {id:"4d2",t:"Residual plot",earn:"States that the linear model is appropriate if the residual plot shows <b>random scatter with no clear pattern</b> (e.g., no curve); a curved pattern would mean a linear model is not appropriate.",not:"“The residuals should be small” or “the residuals should be normal” alone; “points should be close to the line”.",need:[[/pattern|random|scatter|curve/,"Say the residual plot should show no pattern (random scatter)."]]}],
 model:"About 58.4% of the variation in average nightly sleep is accounted for by the linear relationship between nightly sleep and daily screen time. In the residual plot, I would look for random scatter around zero with no clear pattern. A curved pattern would indicate that a linear model is not appropriate."},
{id:"e",q:"A parent concludes: “Reducing a teenager's screen time will cause the teenager to sleep more, so all teenagers in the country should limit screen time.” Identify two problems with this conclusion.",
 pts:[{id:"4e1",t:"No causation (observational)",earn:"Explains that this is an <b>observational study</b> (no random assignment of screen time), so a cause-and-effect conclusion is not justified; may mention a confounding variable (e.g., homework load, stress) related to both.",not:"Only “correlation is not causation” with no reference to the study design or a confounder.",need:[[/observational|random(ly)?\s+assign|confound/,"Explain that the study is observational (no random assignment) or name a confounder."]]},
      {id:"4e2",t:"Population",earn:"Explains that the sample was randomly selected from <b>one school district</b>, so results can be generalized only to <b>teenagers in that district</b>, not to all teenagers in the country.",not:"Generalizing to all teenagers; saying the sample is too small without addressing the population.",need:[[/district/,"Explain that results generalize only to teenagers in this district."]]}],
 model:"First, this is an observational study: screen time was not randomly assigned. Other variables, such as amount of homework or stress, could be related to both screen time and sleep, so we cannot conclude that reducing screen time causes more sleep. Second, the random sample came from one school district, so the results can be generalized only to teenagers in that district, not to all teenagers in the country."},
{id:"f",q:"Should the researcher use this line to predict the nightly sleep of a teenager whose daily screen time is 13 hours? Explain.",
