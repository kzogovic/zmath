<script>
/* ---- shared rubric checks ---- */
const ACCEPT=[/accept(ed|ing|s)?\s+(the\s+)?(h\s*[0₀o]|h-?naught|null)/,"“Accepting H₀” is never correct. Say “fail to reject H₀”."];
const PROVE=[/\bprove/,"Statistics does not “prove” a claim. Say “convincing evidence”."];
const HSTAT=[/h\s*[0₀oaₐ]\s*:\s*(p̂|p\s*-?\s*hat|x̄|x\s*-?\s*bar)/,"A sample statistic (p̂ or x̄) appears in a hypothesis. Hypotheses must be about population parameters (p or μ)."];
const SLEEP=[[1.0,10.47],[1.5,6.91],[2.0,8.8],[2.0,8.09],[2.5,7.92],[3.0,7.84],[3.0,6.54],[3.5,7.58],[3.5,7.12],[4.0,9.88],[4.0,7.65],[4.5,6.99],[4.5,7.04],[5.0,6.5],[5.0,6.23],[5.0,6.71],[5.5,7.08],[5.5,6.57],[6.0,7.17],[6.0,6.34],[6.5,6.25],[6.5,7.35],[7.0,6.38],[7.0,5.62],[7.5,5.6],[8.0,5.87],[8.0,6.87],[8.5,5.04],[9.0,4.8],[9.0,5.7]];
window.ZTEST={n:1,title:"Full-length practice exam",
units:{"1":"Exploring One-Variable Data and Collecting Data","2":"Probability, Random Variables, and Probability Distributions","3":"Inference for Categorical Data: Proportions","4":"Inference for Quantitative Data: Means","5":"Regression Analysis"},
sets:window.ZTEST_SETS,
mc:window.ZTEST_MC,
frq:[
{id:1,type:"Multi-Focus: Practices 1 & 2 (Formulate Questions, Collect Data)",title:"Bike lanes survey",calc:"no",
stem:`<p>The city council of Riverton (population 48,000 adults) is considering adding protected bike lanes on Main Street. The council wants to know what proportion of adult residents of Riverton support the bike lanes. Riverton has four neighborhoods: North, South, East and West. Residents of the West neighborhood live closest to Main Street. The council has a list of all adult residents, with the neighborhood of each one.</p>`,
parts:[
{id:"a",q:"Identify the population and the variable of interest for the council's question. State whether the variable is categorical or quantitative.",
 pts:[{id:"1a1",t:"Population",earn:"Identifies the population as <b>all adult residents of Riverton</b>.",not:"“Residents” with no place, “people in the survey”, “the sample”, “people who use Main Street”, or “the 48,000” with no description.",need:[[/riverton|city|town/,"Name the population specifically: all adult residents of Riverton."]]},
      {id:"1a2",t:"Variable and type",earn:"Identifies the variable as <b>whether a resident supports the bike lanes (yes/no)</b> and states that it is <b>categorical</b>.",not:"Calls it quantitative; names the proportion (that is the parameter, not the variable); or names the variable without its type.",req:[[/categorical/,"The type of the variable (categorical) is not stated."]],forbid:[[/\bis\s+(a\s+)?quantitative/,"Support (yes/no) is categorical, not quantitative."]]}],
 model:"The population is all adults who live in Riverton. The variable is whether an adult resident supports the protected bike lanes on Main Street (yes or no), which is categorical."},
{id:"b",q:"Describe how the council could select a stratified random sample of 400 adult residents. Explain why stratifying by neighborhood could be beneficial in this context.",
 pts:[{id:"1b1",t:"Strata",earn:"Uses the <b>neighborhoods</b> (North, South, East, West) as strata.",not:"Strata that are not described, or treating neighborhoods as clusters (randomly choosing whole neighborhoods).",need:[[/neighbou?rhood/,"Say that the strata are the four neighborhoods."]]},
      {id:"1b2",t:"Random selection mechanism",earn:"Describes a <b>random mechanism</b> that can be carried out: e.g., number the residents in each neighborhood from the list 1 to N, use a random number generator to choose distinct numbers (ignore repeats), and survey those residents.",not:"Only says “randomly select” or “pick residents at random” with no method; selecting people on the street, by convenience, or by volunteering; failing to address repeats; drawing names without describing how names are mixed.",need:[[/random\s*(number|integer|digit)|randint|names?\s+(in|into|from)\s+a\s+hat|generator/,"Describe the random mechanism (for example, a random number generator on the numbered list)."]]},
      {id:"1b3",t:"Reason for stratifying (in context)",earn:"Explains that residents within a neighborhood are likely to have <b>similar opinions</b> (e.g., West residents, closest to Main Street, may differ), so stratifying gives a <b>more precise estimate</b> (less variability) and ensures every neighborhood is represented.",not:"Only “it is more accurate” or “it is fair” with no link to opinions differing by neighborhood; saying stratifying removes bias from nonresponse.",need:[[/similar|differ|opinion|homogeneous|vary/,"Explain that opinions likely differ between neighborhoods (similar within), in context."]]}],
 model:"Use the four neighborhoods as strata. Using the council's list, number the adult residents of each neighborhood (for example, North 1 to N₁). Use a random number generator to select 100 different numbers from each neighborhood's list, ignoring repeats, and survey those residents. (Selecting in proportion to each neighborhood's size is also acceptable.) Stratifying is helpful because residents in the same neighborhood, especially in the West near Main Street, are likely to have similar views about the bike lanes, while views may differ between neighborhoods. Stratifying ensures each neighborhood is represented and gives a more precise estimate of the proportion of all adult residents who support the lanes."},
{id:"c",q:"The council mails the survey to the selected residents. Only 38% return it. Describe a possible source of bias and explain how it would likely affect the council's estimate.",
 pts:[{id:"1c1",t:"Nonresponse bias identified",earn:"Identifies <b>nonresponse bias</b>: residents who did not return the survey may have different opinions from those who did.",not:"Calls it voluntary response bias (the residents were chosen at random), undercoverage, or “the sample is too small”.",req:[[/non-?\s?response|did\s?n[o']t\s+(return|respond)|not\s+(return|respond)/,"Name nonresponse bias (selected residents who did not respond)."]]},
      {id:"1c2",t:"Direction, with reason in context",earn:"States a <b>direction</b> (overestimate or underestimate) with a <b>reason</b>: e.g., residents who strongly oppose losing parking or traffic lanes are more motivated to return the survey, so the estimate of support would likely be too low.",not:"No direction; a direction without explaining why responders differ from nonresponders.",need:[[/over|under|too (high|low)|higher|lower/,"State whether the estimate would be too high or too low, and why."]]}],
 model:"Nonresponse bias: 62% of the randomly selected residents did not return the survey, and they may differ from those who did. For example, residents with strong feelings, such as those who oppose losing parking on Main Street, are more motivated to return it. If so, the proportion who support the lanes would likely be underestimated."},
{id:"d",q:"A local news site posted an online poll, and 1,250 readers voted: 71% opposed the bike lanes. A council member says, “This large sample shows most Riverton adults oppose the lanes.” Explain why this conclusion is not justified.",
 pts:[{id:"1d1",t:"Voluntary response",earn:"Identifies a <b>voluntary response</b> sample: readers chose to take part, and people with strong (often negative) opinions are most likely to respond.",not:"Only “it isn't random” with no explanation of who responds; only “the sample size is too small”.",need:[[/voluntar|chose|self-?select|opt/,"Explain that participants chose themselves (voluntary response)."]]},
      {id:"1d2",t:"Sample size does not fix bias / population",earn:"Explains that a <b>large sample does not remove bias</b>, or that the respondents are news-site readers, not a random sample of <b>all Riverton adults</b>, so results cannot be generalized to them.",not:"Saying the result would be valid with a larger sample.",need:[[/large|size|all\s+(adult|resident)|population|generali/,"Address the large sample size or the population (all Riverton adults)."]]}],
 model:"The poll is a voluntary response sample: readers decided whether to vote, and people with strong opinions, often opponents, are most likely to participate. The respondents are not a random sample of all adult residents of Riverton (some may not even live there). A large sample does not remove this bias, so the 71% cannot be generalized to all Riverton adults."},
{id:"e",q:"A council member notes that streets in nearby cities that have bike lanes have fewer car accidents than streets without them, and concludes that bike lanes cause fewer accidents. Identify a possible confounding variable and explain how it could provide an alternative explanation.",
 pts:[{id:"1e1",t:"Confounding variable",earn:"Names a plausible confounding variable and explains how it is related to <b>both</b> having bike lanes <b>and</b> the number of accidents (e.g., streets with bike lanes tend to be newer or residential, with lower speed limits and less traffic, which also leads to fewer accidents).",not:"A variable related to only one of the two; only saying “correlation is not causation”; a variable with no explanation.",need:[[/traffic|speed|wid|new|residential|volume|lighting|budget|income/,"Name a specific variable and link it to both bike lanes and accidents."]]}],
 model:"Traffic volume is a possible confounding variable. Cities tend to add bike lanes on quieter streets with lower traffic volume, and streets with less traffic also have fewer car accidents. The difference in accidents might be due to traffic volume rather than the bike lanes, so this observational comparison cannot show that bike lanes cause fewer accidents."}]},

{id:2,type:"Multi-Focus: Practices 3 & 4 (Analyze Data, Interpret Results)",title:"Commute times",calc:"rec",
stem:`<p>Random samples of 40 students were selected from each of two high schools, and each student reported the number of minutes of their usual morning commute. The boxplots summarize the data. (Whiskers extend to the minimum and maximum; no outliers are marked.) The sample means are 20.4 minutes for School A and 24.3 minutes for School B.</p>
${ZG.box([{lab:"School A",v:[6,15,19,25,44]},{lab:"School B",v:[10,20,24,28,41]}],{min:5,max:45,step:5,minor:1,grid:5,xlab:"Commute time (minutes)",L:76})}`,
parts:[
{id:"a",q:"Compare the distributions of commute time for the two samples.",
 pts:[{id:"2a1",t:"Center",earn:"States that the <b>median</b> (or mean) commute for School B (24 min) is <b>greater</b> than for School A (19 min), using numbers, <b>in context</b>.",not:"Only lists both medians without comparing (“A is 19, B is 24”); no context (commute time).",need:[[/(greater|higher|larger|more|longer|less|lower|smaller|shorter)/,"Use comparative language (e.g., “greater than”), not just a list of values."],[/commut|minute|time/,"Include context (commute time)."]]},
      {id:"2a2",t:"Variability",earn:"States that School A has <b>more variability</b>, with evidence: IQR 10 vs 8 minutes, or range 38 vs 31 minutes.",not:"Uses the means or medians to compare variability; lists IQRs without a comparison.",need:[[/iqr|range|spread|variab/,"Compare variability with the IQR or range."]]},
      {id:"2a3",t:"Shape (with evidence)",earn:"Describes School A as <b>skewed right</b> AND gives evidence (median − Q1 = 4 < Q3 − median = 6, or mean 20.4 > median 19, or the long upper whisker), and describes School B as roughly <b>symmetric</b> with evidence (Q1 and Q3 each 4 from the median; mean ≈ median).",not:"Only “A is skewed right” with no evidence from the summary statistics, or describing only one school.",need:[[/skew/,"Describe the shape (skewed/symmetric) of each distribution."],[/symmetric/,"Describe the shape of School B (roughly symmetric)."]]}],
 model:"Center: the median commute at School B (24 minutes) is greater than the median at School A (19 minutes). Variability: School A's commute times are more variable: IQR 25 − 15 = 10 minutes versus 28 − 20 = 8 minutes, and range 38 versus 31 minutes. Shape: School A appears skewed to the right, since the distance from the median to Q3 (6) is greater than from Q1 to the median (4), the mean (20.4) exceeds the median (19) and the maximum is far above Q3. School B appears roughly symmetric: Q1 and Q3 are both 4 minutes from the median and the mean (24.3) is close to the median (24)."},
{id:"b",q:"Is the maximum commute time at School A (44 minutes) an outlier? Justify your answer.",
 pts:[{id:"2b1",t:"Fences with work",earn:"Computes IQR = 25 − 15 = 10 and the <b>upper fence</b> Q3 + 1.5(IQR) = 25 + 15 = 40, showing the work.",not:"States a fence with no work, uses the wrong quartiles, or uses 2 standard deviations instead of the 1.5 × IQR rule without justification.",need:[[/40/,"Show the upper fence: 25 + 1.5(10) = 40."]]},
      {id:"2b2",t:"Conclusion",earn:"Concludes that <b>44 is an outlier</b> because 44 > 40.",not:"A conclusion that does not follow from a correctly computed fence, or a conclusion with no comparison to the fence.",need:[[/outlier/,"State clearly whether 44 is an outlier."]]}],
 model:"IQR = 25 − 15 = 10 minutes. Upper fence = Q3 + 1.5(IQR) = 25 + 1.5(10) = 40 minutes. Since 44 > 40, the maximum commute of 44 minutes is an outlier."},
{id:"c",q:"District records show that the commute times for <b>all</b> students at School B are approximately normally distributed with mean 24 minutes and standard deviation 6 minutes. Find the probability that a randomly selected School B student has a commute longer than 30 minutes. Show your work.",
 pts:[{id:"2c1",t:"Distribution named with parameters",earn:"Identifies the <b>normal distribution</b> with mean <b>μ = 24</b> and standard deviation <b>σ = 6</b> (e.g., X ~ N(24, 6)) and the boundary 30 with the direction (greater than), or a correct z = (30 − 24)/6 = 1.",not:"Uses <b>s</b> or <b>x̄</b> for the population standard deviation or mean (these are population values: σ and μ); calculator syntax only, such as normalcdf(30, 1000, 24, 6), with no labels.",forbid:[[/\bs\s*=\s*6\b/,"s is a sample standard deviation. These are population values, so the standard deviation is σ = 6."],[/x̄\s*=\s*24|x-?bar\s*=\s*24/,"x̄ is a sample mean. These are population values: μ = 24."]],need:[[/normal|n\s*\(|z\s*=/,"Name the normal distribution and its parameters (μ = 24, σ = 6), or show the z-score."]]},
      {id:"2c2",t:"Correct probability",earn:"P(X > 30) = P(Z > 1) ≈ <b>0.1587</b> (0.159 or 0.16 also earns).",not:"0.8413 (the area to the left); a probability with no supporting work from the first point.",need:[[/0?\.159|0?\.1587|0?\.16\b/,"The probability should be about 0.159."]]}],
 model:"Let X = commute time of a randomly selected School B student. X ~ Normal(μ = 24, σ = 6). z = (30 − 24)/6 = 1.00. P(X > 30) = P(Z > 1.00) = 1 − 0.8413 = 0.1587."},
{id:"d",q:"Four School B students are selected at random. Find the probability that exactly one of them has a commute longer than 30 minutes.",
 pts:[{id:"2d1",t:"Binomial named with parameters",earn:"Identifies a <b>binomial</b> random variable with <b>n = 4</b> and <b>p = 0.1587</b> (or uses C(4,1)(0.1587)(0.8413)³).",not:"Calculator syntax only, such as binompdf(4, .1587, 1), with no labels; using p = 0.8413 or n = 1.",need:[[/binom|c\s*\(\s*4|4\s*c\s*1|4\s*\(\s*0?\.1587/,"Name the binomial distribution with n = 4 and p = 0.1587, or show the formula."]]},
      {id:"2d2",t:"Correct probability",earn:"P(Y = 1) ≈ <b>0.378</b> (consistent with the student's answer to part (c) is acceptable).",not:"0.1587 × 0.8413³ ≈ 0.0945 (missing the 4 arrangements).",need:[[/0?\.378/,"The probability should be about 0.378 (or consistent with your part (c))."]]}],
 model:"Let Y = number of the 4 students with a commute longer than 30 minutes. Y ~ Binomial(n = 4, p = 0.1587). P(Y = 1) = C(4,1)(0.1587)¹(0.8413)³ = 4(0.1587)(0.5955) ≈ 0.378."},
{id:"e",q:"Using the distribution in part (c), find the commute time that is at the 90th percentile for School B students. Show your work.",
 pts:[{id:"2e1",t:"90th percentile",earn:"Uses the normal distribution with μ = 24 and σ = 6 and z = 1.28 (invNorm(0.90)) to get x = 24 + 1.2816(6) ≈ <b>31.7 minutes</b>, with work shown (formula or labeled values).",not:"Using z = 0.90 or a probability in place of z; an answer with no supporting work; using s instead of σ.",forbid:[[/\bs\s*=\s*6\b/,"These are population values: write σ = 6, not s."]],need:[[/31\.[67]/,"The answer should be about 31.7 minutes."],[/1\.28/,"Show the z-score for the 90th percentile (z ≈ 1.28)."]]}],
 model:"The 90th percentile of the standard normal distribution is z ≈ 1.2816. x = μ + zσ = 24 + 1.2816(6) ≈ 31.7 minutes. About 90% of School B students have commutes shorter than 31.7 minutes."}]},

{id:3,type:"Inference",title:"Meditation app experiment",calc:"rec",
stem:`<p>A sleep researcher recruited 240 adult volunteers who reported mild insomnia. The volunteers were randomly assigned to one of two groups of 120. One group used a guided-meditation app each night for four weeks; the other group received a pamphlet about good sleep habits. At the end of four weeks, each volunteer was classified as improved or not improved based on a sleep-quality questionnaire.</p>
<table class="tb"><tr><th></th><th>Improved</th><th>Not improved</th><th>Total</th></tr><tr><th>Meditation app</th><td>66</td><td>54</td><td>120</td></tr><tr><th>Pamphlet</th><td>48</td><td>72</td><td>120</td></tr></table>`,
parts:[
{id:"a",q:"Do the data provide convincing evidence, at the α = 0.05 level, that the proportion of volunteers like these who would improve is greater with the meditation app than with the pamphlet? Complete the appropriate inference procedure: state hypotheses (defining parameters), identify the procedure and check conditions, calculate the test statistic and p-value, and state a conclusion.",
 pts:[{id:"3a1",t:"Parameters defined",earn:"Defines <b>p_M</b> and <b>p_P</b> as the <b>true (population) proportions</b> of volunteers like these who would improve with the meditation app and with the pamphlet.",not:"Defines parameters as sample proportions (“the proportion of the 120 who improved”); no definition; uses p̂ in the definition.",need:[[/true|population|all|would improve|like these/,"Define the parameters as true/population proportions, not sample proportions."]]},
      {id:"3a2",t:"Hypotheses",earn:"H₀: p_M = p_P (or p_M − p_P = 0) and Hₐ: p_M &gt; p_P (or p_M − p_P &gt; 0).",not:"Hypotheses with p̂ or numbers from the sample; a two-sided or reversed alternative; “≥” in H₀ with no equality version; hypotheses stated in words with no parameters.",forbid:[HSTAT],need:[[/h\s*[aₐ]|alternative/,"State both hypotheses with parameters."]]},
      {id:"3a3",t:"Procedure named",earn:"Names a <b>two-sample z-test for a difference in proportions</b> (two-proportion z-test).",not:"A t-test, a one-sample test, or a confidence interval. Calculator syntax alone (“2-PropZTest”) does not earn the point.",forbid:[[/\bt-?\s?test|2-?\s?samp\s*t/,"This is a test for proportions, so it uses z, not t."]],need:[[/two|2|difference/,"Name the procedure: two-sample z-test for a difference in proportions."]]},
      {id:"3a4",t:"Conditions (both)",earn:"BOTH: (1) the volunteers were <b>randomly assigned</b> to treatments, AND (2) the large counts condition with numbers: expected counts 120(0.475) = 57 and 120(0.525) = 63 in each group, or observed counts 66, 54, 48, 72, are all at least 10.",not:"Only one of the two conditions; “random” without “assigned”; “n ≥ 30” or “CLT” for proportions; counts claimed to be large with no numbers.",forbid:[[/n\s*[>≥]=?\s*30|\bclt\b|central limit/,"For proportions, n ≥ 30 and the CLT do not establish normality. Check counts ≥ 10."]],need:[[/random(ly)?\s+assign|random\s+assignment/,"Say that the volunteers were randomly assigned to treatments."],[/57|63|66|54|48|72/,"Show the counts and compare them with 10."]]},
      {id:"3a5",t:"Test statistic",earn:"z ≈ <b>2.33</b> (using p̂_c = 114/240 = 0.475 and SE ≈ 0.0645), with work or values shown.",not:"An incorrect z with no work; using the unpooled SE gives about 2.34, which also earns the point only if work is shown.",need:[[/2\.3[2-4]/,"The test statistic should be about z = 2.33."]]},
      {id:"3a6",t:"p-value",earn:"p-value ≈ <b>0.010</b> (one-sided), consistent with the test statistic.",not:"A two-sided p-value (≈ 0.020) for this one-sided alternative.",need:[[/0?\.0099|0?\.010\b|0?\.01\b/,"The p-value should be about 0.010."]]},
      {id:"3a7",t:"Decision with comparison",earn:"Compares the p-value to α and makes a decision: “Because p-value ≈ 0.010 &lt; α = 0.05, we reject H₀.”",not:"Only “p &lt; α” with no decision; a decision with no comparison; “accept Hₐ” with no comparison.",forbid:[ACCEPT],req:[[/reject/,"State a formal decision: reject H₀ (or fail to reject H₀)."]],need:[[/0?\.05/,"Compare the p-value with α = 0.05."]]},
      {id:"3a8",t:"Conclusion in context",earn:"“There is <b>convincing evidence</b> that the true proportion of volunteers like these who would improve is <b>greater</b> with the meditation app than with the pamphlet.” Must be about population parameters, in context, and match Hₐ.",not:"Conclusions about sample proportions (“66 of 120 is more than 48 of 120”); “proves”; “the app works for everyone”; a conclusion not matching the one-sided alternative.",forbid:[ACCEPT],need:[[/convincing evidence|sufficient evidence/,"Use “convincing evidence” language."],[/true|population|volunteers like|would improve/,"Conclude about the true (population) proportions, in context."]],flag:[PROVE]}],
 model:"Let p_M = the true proportion of volunteers like these who would improve with the meditation app, and p_P = the true proportion who would improve with the pamphlet.<br>H₀: p_M = p_P &nbsp; Hₐ: p_M &gt; p_P<br>Procedure: two-sample z-test for a difference in proportions.<br>Conditions: Random: the volunteers were randomly assigned to the two treatments. Large counts: p̂_c = (66 + 48)/240 = 0.475. Expected counts: 120(0.475) = 57 improved and 120(0.525) = 63 not improved in each group, all at least 10.<br>p̂_M = 66/120 = 0.55, p̂_P = 48/120 = 0.40. SE = √[0.475(0.525)(1/120 + 1/120)] ≈ 0.0645. z = (0.55 − 0.40 − 0)/0.0645 ≈ 2.33. p-value = P(Z ≥ 2.33) ≈ 0.010.<br>Because the p-value ≈ 0.010 &lt; α = 0.05, we reject H₀. There is convincing evidence that the true proportion of volunteers like these who would improve is greater with the meditation app than with the pamphlet."},
{id:"b",q:"Based on your decision in part (a), which type of error, Type I or Type II, could you have made? Describe that error in context and give one consequence of it.",
 pts:[{id:"3b1",t:"Error type in context",earn:"Identifies a <b>Type I error</b> (consistent with rejecting H₀ in part (a)) and describes it in context: concluding that the meditation app leads to a higher improvement rate when, in fact, it does not. Gives a reasonable consequence (e.g., people pay for and spend time on an app that does not help them sleep better than a free pamphlet).",not:"Type II error after rejecting H₀; a description that is not in context; describing the error as “rejecting the null when it's true” with no context; no consequence.",need:[[/type\s*(i\b|1|one)/,"Name the error consistent with your decision (Type I if you rejected H₀)."],[/app|meditation|pamphlet/,"Describe the error in context."]]}],
 model:"Because H₀ was rejected, a Type I error is possible: concluding that the true proportion who improve is higher with the meditation app than with the pamphlet when, in fact, it is not. A consequence: doctors might recommend the app, and patients would spend money and time on it without any real improvement over the free pamphlet."},
{id:"c",q:"Based on your conclusion, can the researcher conclude that using the meditation app causes improvement in sleep for all adults with insomnia? Explain.",
 pts:[{id:"3c1",t:"Cause and scope of inference",earn:"States that a <b>causal</b> conclusion is justified because treatments were <b>randomly assigned</b>, BUT the result applies only to <b>volunteers like these</b>, not to all adults with insomnia, because the volunteers were <b>not randomly selected</b>.",not:"Generalizing to all adults with insomnia; denying causation even though there was random assignment; addressing only one of the two issues.",need:[[/random(ly)?\s+assign|random\s+assignment/,"Explain that random assignment allows a cause-and-effect conclusion."],[/volunteer|not\s+random(ly)?\s+select|not\s+a\s+random\s+sample/,"Explain that generalization is limited to volunteers like these (no random selection)."]]}],
 model:"Partly. Because the volunteers were randomly assigned to treatments, we can conclude that the meditation app caused the higher improvement rate. However, the volunteers were not randomly selected from all adults with insomnia, so we can only generalize to volunteers like these (adults with mild insomnia who would volunteer), not to all adults with insomnia."}]},

{id:4,type:"Multi-Focus: Practices 2, 3 & 4 (Collect, Analyze, Interpret)",title:"Screen time and sleep",calc:"help",
stem:`<p>A health researcher selected a random sample of 30 teenagers from a large school district. For each teenager, she recorded the average daily screen time, in hours (<i>x</i>), and the average nightly sleep, in hours (<i>y</i>). The computer output for the least-squares regression is shown.</p>
<table class="tb"><tr><th>Predictor</th><th>Coef</th></tr><tr><td>Constant</td><td>9.12</td></tr><tr><td>Screen time</td><td>−0.42</td></tr></table><p>R-Sq = 58.3% &nbsp; · &nbsp; r = −0.764</p>${ZG.scatter(SLEEP,{xmin:0,xmax:10,xstep:1,ymin:4,ymax:11,ystep:1,xlab:"Daily screen time (hours)",ylab:"Nightly sleep (hours)",line:[9.12,-0.42],lx:[1,9],grid:1})}${ZG.resid(SLEEP.map(([x,y])=>[x,Math.round((y-(9.118-0.4197*x))*100)/100]),{xmin:0,xmax:10,xstep:1,ymin:-2,ymax:2,ystep:1,xlab:"Daily screen time (hours)",grid:1})}
<p>The screen times in the sample ranged from 1 hour to 9 hours per day.</p>`,
parts:[
{id:"a",q:"Write the equation of the least-squares regression line, and interpret its slope in context.",
 pts:[{id:"4a0",t:"Equation",earn:"<b>predicted sleep = 9.12 − 0.42(screen time)</b>, or ŷ = 9.12 − 0.42x with x and ŷ defined in context.",not:"“y = 9.12 − 0.42x” (no hat / no “predicted”: the line gives predicted values, not actual ones); variables not defined; slope and intercept switched.",req:[[/predict|ŷ|y\s*-?\s*hat|estimated/,"The response must be PREDICTED: use ŷ or “predicted sleep”, not y."]],need:[[/9\.12/,"Use the intercept 9.12."],[/sleep/,"Define the variables in context."]]},
      {id:"4a1",t:"Slope interpretation",earn:"“For each additional hour of daily screen time, the <b>predicted</b> nightly sleep <b>decreases</b> by 0.42 hours.” (“on average” or “estimated” is also accepted.)",not:"No “predicted” / “on average” language (“sleep decreases by 0.42 hours”); causal language (“each hour of screen time causes …”); wrong direction; no context.",req:[[/predict|on average|estimat|expected/,"A slope interpretation must describe the PREDICTED (or average) response."]],forbid:[[/caus/,"Causal language is not justified for observational data."]],need:[[/0?\.42/,"Use the slope value 0.42."],[/sleep/,"Include context (sleep and screen time)."]]}],
 model:"predicted sleep = 9.12 − 0.42(screen time). For each additional hour of average daily screen time, the predicted average nightly sleep decreases by 0.42 hours."},
{id:"b",q:"Interpret the y-intercept in context. Is it reasonable to interpret it here? Explain.",
 pts:[{id:"4b1",t:"Intercept",earn:"“A teenager with 0 hours of daily screen time has a <b>predicted</b> nightly sleep of 9.12 hours,” AND notes that 0 is outside the observed screen times (1 to 9), so this is an <b>extrapolation</b> and may not be reliable.",not:"No “predicted” language; not addressing whether x = 0 is within the data.",req:[[/predict|on average|estimat|expected/,"The intercept must be stated as a PREDICTED value."]],need:[[/9\.12/,"Use the intercept 9.12."],[/extrapol|outside|range|1\s*(to|-|–)\s*9/,"Comment on whether 0 hours is within the range of the data."]]}],

{id:"c",q:"One teenager in the sample had 5 hours of daily screen time and 6.5 hours of nightly sleep. Calculate and interpret the residual for this teenager.",
 pts:[{id:"4c1",t:"Residual calculated",earn:"Predicted = 9.12 − 0.42(5) = 7.02 hours; residual = 6.5 − 7.02 = <b>−0.52</b> hours.",not:"Predicted − actual (+0.52); no work.",req:[[/[-−–]\s*0?\.52/,"The residual is actual − predicted = −0.52."]]},
      {id:"4c2",t:"Residual interpreted",earn:"“This teenager sleeps 0.52 hours <b>less than predicted</b> by the regression line for a teenager with 5 hours of screen time.”",not:"“less than average”; no context.",need:[[/less than (what is |was )?predicted|below (the )?predict|lower than predicted|overpredict/,"Interpret: the actual sleep is 0.52 hours less than predicted."]]}],

{id:"d",q:"Interpret the value of R-Sq in context. Then use the residual plot to decide whether a linear model is appropriate for these data. Explain.",

      {id:"4d2",t:"Residual plot",earn:"Concludes that a linear model <b>is appropriate</b> because the residual plot shows <b>random scatter around 0 with no clear pattern</b> (no curve).",not:"“The residuals should be small” or “the residuals should be normal” alone; “points should be close to the line”.",need:[[/pattern|random|scatter|curve/,"Say the residual plot should show no pattern (random scatter)."]]}],
 model:"About 58.3% of the variation in average nightly sleep is accounted for by the linear relationship between nightly sleep and daily screen time. The residual plot shows random scatter above and below 0 with no curved or other clear pattern, so a linear model is appropriate for describing the relationship."},
{id:"e",q:"A parent concludes: “Reducing a teenager's screen time will cause the teenager to sleep more, so all teenagers in the country should limit screen time.” Identify two problems with this conclusion.",
 pts:[{id:"4e1",t:"No causation (observational)",earn:"Explains that this is an <b>observational study</b> (no random assignment of screen time), so a cause-and-effect conclusion is not justified; may mention a confounding variable (e.g., homework load, stress) related to both.",not:"Only “correlation is not causation” with no reference to the study design or a confounder.",need:[[/observational|random(ly)?\s+assign|confound/,"Explain that the study is observational (no random assignment) or name a confounder."]]},
      {id:"4e2",t:"Population",earn:"Explains that the sample was randomly selected from <b>one school district</b>, so results can be generalized only to <b>teenagers in that district</b>, not to all teenagers in the country.",not:"Generalizing to all teenagers; saying the sample is too small without addressing the population.",need:[[/district/,"Explain that results generalize only to teenagers in this district."]]}],
 model:"First, this is an observational study: screen time was not randomly assigned. Other variables, such as amount of homework or stress, could be related to both screen time and sleep, so we cannot conclude that reducing screen time causes more sleep. Second, the random sample came from one school district, so the results can be generalized only to teenagers in that district, not to all teenagers in the country."},
{id:"f",q:"Should the researcher use this line to predict the nightly sleep of a teenager whose daily screen time is 13 hours? Explain.",

 model:"No. The screen times in the sample ranged from 1 to 9 hours. Thirteen hours is outside this range, so using the line would be extrapolation: the linear relationship may not hold for such high screen times."}]}
