name: Find direct PDF links (one-time)
on:
  push:
    paths: [".github/workflows/direct-links.yml", "tools/check_links.py"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_links.py
      - run: |
          git config user.name "kzogovic"
          git config user.email "kzogovic@users.noreply.github.com"
          git add tools/link_check.json
          git commit -m "Link check results" || echo "nothing to commit"
          git pull --rebase origin main && git push
